<!DOCTYPE html>
<html lang="en" style="height:100%">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hot Tub Tri Machine Podcast</title>
    <meta name="description" content="Hot Tub Tri Machine — a podcast with Ursula &amp; The Beast for everyday triathletes, swimmers, cyclists and runners. Training, goals, and hot-tub chat after the race." />
    <meta property="og:site_name" content="Hot Tub Tri Machine" />
    <meta name="application-name" content="Hot Tub Tri Machine" />
    <base href="/" />

    <!-- Fast inline JS flag: mark browser as JS-enabled and in "loading" state.
         This lets us hide the static SEO stub for JS users until Blazor is ready,
         while leaving the static content visible for crawlers / no-JS clients. -->
    <script>
        document.documentElement.classList.add('js-loading');
    </script>

    <!-- Minimal critical styles for the loading state (applies only when .js-loading is set) -->
    <style>
        /* Hide the static SEO block for JS-enabled browsers while app loads */
        .js-loading #static-seo-content { display: none !important; }

        /* Ensure spinner is visible and centered during loading */
        .js-loading .loading-progress { display: block !important; opacity: 1; }

        /* Avoid painting the heavy background tile images while loading */
        .js-loading .background::before,
        .js-loading .background::after { visibility: hidden; }

        /* Loading helper text positioning */
        .js-loading .loading-progress-text {
            display: block;
            position: absolute;
            top: calc(50% + 140px);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,0,0,0.75);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            font-size: 1rem;
            text-align: center;
        }
    </style>

    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Hot Tub Tri Machine",
          "url": "https://www.hottubtrimachine.au/"
        }
    </script>
    <link rel="canonical" href="https://www.hottubtrimachine.au/" />
    <script>
        (function () {
        const canonicalHost = "www.hottubtrimachine.au";
        const apexHost = "hottubtrimachine.au";
        const { protocol, host, pathname, search, hash } = window.location;

        // Keep a single canonical host for SEO and avoid duplicate indexing.
        if (protocol === "https:" && host === apexHost) {
        window.location.replace(`https://${canonicalHost}${pathname}${search}${hash}`);
        return;
        }

        if (protocol === "https:" && host === canonicalHost) {
        const canonicalHref = `https://${canonicalHost}${pathname}${search}`;
        let canonicalLink = document.querySelector("link[rel='canonical']");
        if (!canonicalLink) {
        canonicalLink = document.createElement("link");
        canonicalLink.setAttribute("rel", "canonical");
        document.head.appendChild(canonicalLink);
        }
        canonicalLink.setAttribute("href", canonicalHref);
        }
        })();
    </script>

    <link rel="icon" type="image/ico" href="favicon.ico" />
    <link href="HotTubTriMachine.styles.css" rel="stylesheet" />
    <RadzenTheme Theme="material" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="app" class="background" style="height: 100%">
        <main id="static-seo-content">
            <h1>Hot Tub Tri Machine</h1>
            <p>Podcast with Ursula &amp; The Beast — for everyday triathletes, swimmers, cyclists and runners.</p>
            <p>Chatting about training, goals and all the things…just like you do in a hot tub after the race or in the carpark after swim squad.</p>
        </main>
        <svg class="loading-progress" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading hot tub">
            <!-- tub base -->
            <ellipse cx="60" cy="78" rx="38" ry="14" fill="#8b5e3c" />
            <!-- tub rim -->
            <ellipse cx="60" cy="68" rx="34" ry="10" fill="#a97146" />
            <!-- water -->
            <ellipse cx="60" cy="68" rx="28" ry="8" fill="#4fc3f7" />

            <!-- steam -->
            <g fill="none" stroke="#9ea7b3" stroke-width="3" stroke-linecap="round">
                <!-- left wisp -->
                <path class="steam steam-1" d="M48 52 C46 46, 50 40, 48 34" />
                <!-- center wisp -->
                <path class="steam steam-2" d="M60 50 C58 44, 62 38, 60 32" />
                <!-- right wisp -->
                <path class="steam steam-3" d="M72 52 C70 46, 74 40, 72 34" />
            </g>
        </svg>
        <div class="loading-progress-text">Warming up the hot tub…</div>
    </div>

    <div id="blazor-error-ui" aria-hidden="true">
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Ensure we remove the js-loading flag when Blazor is ready.
         Using Blazor.start() gives us a clear promise and avoids flicker. -->
    <script>
        (function () {
            if (window.Blazor && typeof window.Blazor.start === 'function') {
                window.Blazor.start()
                    .then(() => document.documentElement.classList.remove('js-loading'))
                    .catch(() => {
                        // Fallback: remove after a short delay to avoid permanent loading UI
                        setTimeout(() => document.documentElement.classList.remove('js-loading'), 1500);
                    });
            } else {
                // If Blazor API not available (unexpected), remove loading state after short timeout
                setTimeout(() => document.documentElement.classList.remove('js-loading'), 1500);
            }
        })();
    </script>

    <script src="_content/Radzen.Blazor/Radzen.Blazor.js?v=@(typeof(Radzen.Colors).Assembly.GetName().Version)"></script>
</body>

</html>
